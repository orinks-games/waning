# Builds the player downloads with `hearken release` on Windows, macOS and
# Linux. A run started by hand keeps the archives as workflow artifacts; a
# pushed v* tag also attaches them to that tag's GitHub release.
name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config build-essential libasound2-dev \
            libpulse-dev libspeechd-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxss-dev libxkbcommon-dev libwayland-dev \
            wayland-protocols libdecor-0-dev libegl1-mesa-dev libgl1-mesa-dev \
            libdbus-1-dev libudev-dev

      - name: Toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Install the hearken command
        shell: bash
        run: |
          # The same Hearken commit the game is locked to, so a cached older
          # copy of the command is replaced when the lock moves.
          rev=$(grep -m1 -o 'orinks-games/hearken?rev=[0-9a-f]*' Cargo.lock | cut -d= -f2)
          cargo install --locked --git https://github.com/orinks-games/hearken --rev "$rev" hearken-cli

      - name: Stage SDL2 again
        if: runner.os == 'Windows'
        # hearken-app's build script puts SDL2.dll beside the build, but the
        # cache restores the build without it and the script does not run
        # again. Cleaning that one crate makes it run.
        run: cargo clean --release -p hearken-app

      - name: Build the release
        run: hearken release .

      - name: Check the Windows zip has SDL2
        if: runner.os == 'Windows'
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = Get-Item dist/*-windows-x64.zip
          $names = [IO.Compression.ZipFile]::OpenRead($zip.FullName).Entries.Name
          if ($names -notcontains 'SDL2.dll') { Write-Error "SDL2.dll is missing from $($zip.Name)"; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: waning-${{ matrix.os }}
          path: dist/*

      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          # The CHANGELOG section for this version, without its heading.
          version="${GITHUB_REF_NAME#v}"
          awk -v h="## $version" '$0 == h {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md
